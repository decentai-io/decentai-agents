# The Microsoft Teams agent — one person's Teams chats, read and
# answered, and posts to channels, through the platform's gates over
# Microsoft Graph.
#
# It lists the account's chats (one-to-one, group and meeting chats),
# reads a chat as text, and says whether anyone answered something it
# sent. Sending a chat message and posting to a channel are level-3
# actions that wait for the user. It rides the Microsoft connection the
# Outlook, Microsoft Calendar and OneDrive agents use, and asks only for
# permissions a person can grant without an administrator — which is
# why channel messages can be posted here but not read.

schema_version: "1.0"

agent:
  id: teams
  name: Microsoft Teams
  version: "0.1.3"
  description: >
    Your Teams chats through the assistant. Catch up on a chat, see
    whether someone answered, and send a message or post to a channel
    on your go-ahead.
  tags:
    - chat
    - teams
    - microsoft
    - productivity
  examples:
    - title: "Catch up"
      prompt: "What did Dana say in our Teams chat?"
    - title: "Answer it"
      prompt: "Tell Dana on Teams the drawings are coming Thursday."
    - title: "Did they answer"
      prompt: "Has Dana replied to what I sent her on Teams?"
  instructions: >
    Use this agent for Microsoft Teams. Chats are addressed by chat_id;
    find one with chats.list (with narrows to chats that include a
    person's email address), never invent one. chats.messages reads a
    chat as text, oldest first. To message one person, pass their email
    address as to; resolve a name to an address first (from a mail
    thread, or ask). Sending a chat message and posting to a channel
    leave the platform and may pause for approval: show the user the
    exact text and ask before each, and never send anything they did
    not see. If a send comes back with an unknown outcome, check the
    chat with chats.messages before trying again. chats.replies says
    whether anyone answered a message this agent sent. Channel messages
    cannot be read here, only posted.

implementation:
  entrypoint: agent:TeamsAgent
  dependencies:
    - requests>=2.31,<3

# Where it connects, and the whole of it. The consent and token
# addresses above are the platform's to call, not the agent's.
network:
  hosts:
    - graph.microsoft.com

resources:
  secrets:
    - id: microsoft
      label: Microsoft Account
      description: >
        A Microsoft 365 account, connected by signing in. Every
        Microsoft agent in the catalog asks for the same permissions, so
        one saved account can be granted to each of them. The platform
        keeps and refreshes the tokens; this agent receives a
        short-lived access token and the address. An account connected
        before this version needs one reconnect to add the new
        permissions. api_base_url is for tests only; leave it empty.
      binding: {cardinality: one, required: true}
      oauth:
        provider: microsoft
        authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
        token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
        scopes:
          - openid
          - email
          - offline_access
          - User.Read
          - Mail.ReadWrite
          - Mail.Send
          - Calendars.ReadWrite
          - Files.ReadWrite.All
          - Chat.ReadWrite
          - Team.ReadBasic.All
          - Channel.ReadBasic.All
          - ChannelMessage.Send
          - Tasks.ReadWrite
        identity: {url: https://graph.microsoft.com/v1.0/me, field: userPrincipalName}
      fields:
        - {name: api_base_url, label: API Base URL (tests only), type: string, storage: keys, required: false}

  data:
    - id: sent
      label: Sent Message
      description: Every chat message and channel post this agent sent, and where.
      binding: {cardinality: many, required: false}
      fields:
        - {name: kind,       label: Kind,       type: select, storage: keys, required: true, options: [chat, channel]}
        - {name: chat_id,    label: Chat or Channel ID, type: string, storage: keys, required: true}
        - {name: team_id,    label: Team ID,    type: string, storage: keys, required: false}
        - {name: to,         label: To,         type: string, storage: keys, required: true}
        - {name: text,       label: Text,       type: string, storage: keys, required: true}
        - {name: message_id, label: Message ID, type: string, storage: keys, required: true}
        - {name: sent_at,    label: Sent At,    type: string, storage: keys, required: true}
        - {name: link,       label: Link,       type: string, storage: keys, required: false}

tools:
  - id: account
    name: Account
    description: The connected account.
    resources:
      secrets: [microsoft]
    functions:
      - id: status
        name: Teams Status
        description: Confirm the connection and say whose account it is.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          properties: {}
        outputs:
          type: object
          required: [connected, email]
          properties:
            connected: {type: boolean}
            email:     {type: string}
            name:      {type: string}
            problem:   {type: string}

  - id: chats
    name: Chats
    description: Reads chats freely; sends only on authorization.
    resources:
      secrets: [microsoft]
      data:    [sent]
    functions:
      - id: list
        name: List Chats
        description: >
          The account's chats, most recently active first — one-to-one,
          group and meeting chats — each with who is in it. with narrows
          to chats that include that email address.
        permission_level: 0
        timeout_seconds: 45
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          properties:
            with:        {type: string, maxLength: 200}
            max_results: {type: integer, minimum: 1, maximum: 50, default: 20}
        outputs:
          type: object
          required: [chats]
          properties:
            chats:
              type: array
              items:
                type: object
                properties:
                  chat_id: {type: string}
                  kind:    {type: string}
                  topic:   {type: string}
                  members: {type: string}
                  updated: {type: string}
                  link:    {type: string}

      - id: messages
        name: Read Chat
        description: The latest messages in a chat as text, oldest first; system notices left out.
        permission_level: 0
        timeout_seconds: 45
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          required: [chat_id]
          properties:
            chat_id:     {type: string, minLength: 1, maxLength: 400}
            max_results: {type: integer, minimum: 1, maximum: 50, default: 20}
        outputs:
          type: object
          required: [chat_id, messages]
          properties:
            chat_id: {type: string}
            topic:   {type: string}
            messages:
              type: array
              items:
                type: object
                properties:
                  message_id: {type: string}
                  from:       {type: string}
                  from_name:  {type: string}
                  sent:       {type: string}
                  text:       {type: string}
                  mine:       {type: boolean}

      - id: send
        name: Send Chat Message
        description: >
          Send text to a chat (chat_id), or to one person by email
          address (to) — their one-to-one chat, started if there is none.
          It leaves the platform — only on the user's go-ahead, with the
          exact text they saw.
        permission_level: 3
        timeout_seconds: 45
        resources:
          secrets: {microsoft: use}
          data:    {sent: [create]}
        inputs:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text:    {type: string, minLength: 1, maxLength: 4000}
            chat_id: {type: string, maxLength: 400}
            to:      {type: string, maxLength: 200}
        outputs:
          type: object
          required: [sent_ref, chat_id, message_id, sent_at]
          properties:
            sent_ref:   {type: string, x-resource: {type: data, id: sent}}
            chat_id:    {type: string}
            message_id: {type: string}
            sent_at:    {type: string}

      - id: replies
        name: Replies
        description: >
          Whether anyone answered a chat message this agent sent
          (sent_ref), and what they said.
        permission_level: 0
        timeout_seconds: 45
        resources:
          secrets: {microsoft: use}
          data:    {sent: [read]}
        inputs:
          type: object
          additionalProperties: false
          required: [sent_ref]
          properties:
            sent_ref: {type: string, x-resource: {type: data, id: sent}}
        outputs:
          type: object
          required: [replied, replies]
          properties:
            replied: {type: boolean}
            chat_id: {type: string}
            replies: {type: array, items: {type: object}}

  - id: teams
    name: Teams and Channels
    description: The teams the account belongs to, their channels, and posting on authorization.
    resources:
      secrets: [microsoft]
      data:    [sent]
    functions:
      - id: list
        name: List Teams
        description: The teams the account is a member of.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          properties: {}
        outputs:
          type: object
          required: [teams]
          properties:
            teams: {type: array, items: {type: object}}

      - id: channels
        name: List Channels
        description: A team's channels.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          required: [team_id]
          properties:
            team_id: {type: string, minLength: 1, maxLength: 200}
        outputs:
          type: object
          required: [channels]
          properties:
            channels: {type: array, items: {type: object}}

      - id: post
        name: Post to Channel
        description: >
          Post text, with an optional subject, to a team's channel. It
          leaves the platform — only on the user's go-ahead, with the
          exact text they saw.
        permission_level: 3
        timeout_seconds: 45
        resources:
          secrets: {microsoft: use}
          data:    {sent: [create]}
        inputs:
          type: object
          additionalProperties: false
          required: [team_id, channel_id, text]
          properties:
            team_id:    {type: string, minLength: 1, maxLength: 200}
            channel_id: {type: string, minLength: 1, maxLength: 400}
            text:       {type: string, minLength: 1, maxLength: 4000}
            subject:    {type: string, maxLength: 200}
        outputs:
          type: object
          required: [sent_ref, message_id]
          properties:
            sent_ref:   {type: string, x-resource: {type: data, id: sent}}
            message_id: {type: string}
            link:       {type: string}
