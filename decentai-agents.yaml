# The agents this repository offers.
#
# DecentAI reads this file without running any of the code beneath it:
# every path is resolved inside the checkout, every manifest is validated,
# and nothing executes until an administrator approves an agent by name.

schema_version: "1.0"

catalog:
  id: decentai_reference
  name: DecentAI Agents
  description: >
    General-purpose agents anyone at work can use on the first
    afternoon: the accounts you already work in, the files you hand
    over, and the things you keep. Nothing ships with the platform;
    install what a deployment needs.

# An entry is an id and a path, and nothing else: what an agent is called
# and what it does are its manifest's to say, so that there is one answer
# rather than two that can disagree. `id` must equal the `agent.id` in the
# manifest at `path`.
agents:
