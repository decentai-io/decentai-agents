# The Excel Online agent — workbooks in a Microsoft 365 OneDrive, read
# and written cell by cell over Microsoft Graph's workbook API.
#
# It finds .xlsx workbooks, names what is inside them (worksheets and
# the block each one uses, tables with their headers and row counts),
# reads a range or a table's rows, and — only as level-3 actions that
# wait for the user — appends rows to a table or overwrites a range,
# each recorded with what it wrote and, for an overwrite, what was
# there before. A watch on a table or a worksheet lets a schedule wake
# the assistant only when rows were added.
#
# No file leaves OneDrive: the workbook is read where it is, so nothing
# crosses the worker wire but the cells asked for.

schema_version: "1.0"

agent:
  id: excel_online
  name: Excel Online
  version: "0.1.2"
  description: >
    Excel workbooks in your Microsoft 365 OneDrive, through the
    assistant. Find a workbook, read a sheet or a table, add rows or
    change cells on your go-ahead, and have the assistant woken only
    when new rows arrive.
  tags:
    - spreadsheets
    - excel
    - microsoft
    - productivity
  examples:
    - title: "Read a table"
      prompt: "Open the Sidra orders workbook in my OneDrive and show me the last ten rows of the Orders table."
    - title: "Add a row"
      prompt: "Add a row to the Orders table: Harbourline, 20 desks, AED 18,400, due 30 November."
    - title: "Watch for new rows"
      prompt: "Watch the Orders table and, whenever a new order is added, tell me the customer and the amount."
  instructions: >
    Use this agent to read or change Excel workbooks (.xlsx) in the
    user's OneDrive. Find the workbook first (workbooks.find) and take
    its workbook_id from the result; never invent an id, a worksheet
    name or a table name — workbooks.get lists the worksheets and tables
    a workbook really has. Prefer a table when there is one:
    table.rows reads rows keyed by header, and table.add_rows appends
    rows given as objects keyed by those same headers. range.read reads
    a block by A1 address (A1:D40), or the used range when no address
    is given; say when rows_cut or columns_cut shows the answer was
    capped. table.add_rows and range.update change the user's workbook,
    may pause for approval, and are each recorded; range.update keeps
    what the cells held before, so show the user what will be replaced
    before asking. A write that comes back "unknown" may have landed:
    read the table or range before trying again. To act on rows as they
    are added, record a watch ONCE (rows.watch, on a table when the
    workbook has one, otherwise a worksheet) and schedule rows.new with
    wake_field "rows"; each wake carries only the rows added since the
    last check, keyed by header and naming its watch. A watch listed in
    "reset" lost rows since the last check and reported nothing this
    time — tell the user in one sentence. Never record a second watch
    for the same request.

implementation:
  entrypoint: agent:ExcelOnlineAgent
  dependencies:
    - requests>=2.31,<3

# Where it connects, and the whole of it. The consent and token
# addresses above are the platform's to call, not the agent's.
network:
  hosts:
    - graph.microsoft.com

resources:
  secrets:
    - id: microsoft
      label: Microsoft Account
      description: >
        A Microsoft 365 account, connected by signing in — the same
        connection the other Microsoft agents use; grant one saved
        account to all of them. The platform keeps and refreshes the
        tokens; this agent receives a short-lived access token.
        api_base_url is for tests only; leave it empty.
      binding: {cardinality: one, required: true}
      oauth:
        provider: microsoft
        authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
        token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
        scopes:
          - openid
          - email
          - offline_access
          - User.Read
          - Mail.ReadWrite
          - Mail.Send
          - Calendars.ReadWrite
          - Files.ReadWrite.All
          - Chat.ReadWrite
          - Team.ReadBasic.All
          - Channel.ReadBasic.All
          - ChannelMessage.Send
          - Tasks.ReadWrite
        identity: {url: https://graph.microsoft.com/v1.0/me, field: userPrincipalName}
      fields:
        - {name: api_base_url, label: API Base URL (tests only), type: string, storage: keys, required: false}

  data:
    - id: write
      label: Workbook Write
      description: >
        Every change this agent made to a workbook: rows appended to a
        table, or a range overwritten with what it held before.
      binding: {cardinality: many, required: false}
      fields:
        - {name: kind,        label: Kind,        type: select, storage: keys,   required: true, options: [add_rows, update_range]}
        - {name: workbook_id, label: Workbook ID, type: string, storage: keys,   required: true}
        - {name: workbook,    label: Workbook,    type: string, storage: keys,   required: true}
        - {name: target,      label: Table or Range, type: string, storage: keys, required: true}
        - {name: rows,        label: Rows,        type: number, storage: keys,   required: true}
        - {name: status,      label: Status,      type: select, storage: keys,   required: true, options: [written, unknown]}
        - {name: written,     label: Written,     type: object, storage: values, required: false}
        - {name: previous,    label: Previous,    type: object, storage: values, required: false}

    - id: watch
      label: Row Watch
      description: >
        A table or worksheet the user wants to hear about as rows are
        added, and how many data rows it held at the last check.
      binding: {cardinality: many, required: false}
      fields:
        - {name: workbook_id, label: Workbook ID, type: string, storage: keys, required: true}
        - {name: workbook,    label: Workbook,    type: string, storage: keys, required: true}
        - {name: table,       label: Table,       type: string, storage: keys, required: false}
        - {name: worksheet,   label: Worksheet,   type: string, storage: keys, required: true}
        - {name: cursor,      label: Rows Seen,   type: number, storage: keys, required: true}
        - {name: status,      label: Status,      type: select, storage: keys, required: true, options: [watching, closed]}
        - {name: note,        label: Note,        type: string, storage: keys, required: false}

tools:
  - id: account
    name: Account
    description: The connected Microsoft 365 account.
    resources:
      secrets: [microsoft]
    functions:
      - id: status
        name: Account Status
        description: Confirm the Microsoft connection works and which address it is.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          properties: {}
        outputs:
          type: object
          required: [connected, email]
          properties:
            connected: {type: boolean}
            email:     {type: string}
            problem:   {type: string}

  - id: workbooks
    name: Workbooks
    description: Finds .xlsx workbooks in the drive and names what is inside one.
    resources:
      secrets: [microsoft]
    functions:
      - id: find
        name: Find Workbooks
        description: >
          Excel workbooks (.xlsx only) whose name or content matches
          query, anywhere in the drive; every workbook when query is
          left out. Each row carries the workbook_id the other functions
          take.
        permission_level: 0
        timeout_seconds: 45
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          properties:
            query:       {type: string, maxLength: 200}
            max_results: {type: integer, minimum: 1, maximum: 25, default: 10}
        outputs:
          type: object
          required: [workbooks, more]
          properties:
            more: {type: boolean}
            workbooks:
              type: array
              items: &workbook_row
                type: object
                properties:
                  item_id:  {type: string}
                  name:     {type: string}
                  folder:   {type: string}
                  modified: {type: string}
                  size:     {type: integer}
                  link:     {type: string}

      - id: get
        name: Inside A Workbook
        description: >
          A workbook's worksheets (each with the block of cells in use
          and its row and column counts) and tables (each with its
          worksheet, header row and number of data rows).
        permission_level: 0
        timeout_seconds: 60
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          required: [workbook_id]
          properties:
            workbook_id: {type: string, minLength: 1, maxLength: 200}
        outputs:
          type: object
          required: [workbook, worksheets, tables]
          properties:
            workbook: *workbook_row
            worksheets:
              type: array
              items:
                type: object
                properties:
                  name:       {type: string}
                  used_range: {type: string}
                  rows:       {type: integer}
                  columns:    {type: integer}
                  visible:    {type: boolean}
            tables:
              type: array
              items:
                type: object
                properties:
                  name:      {type: string}
                  worksheet: {type: string}
                  headers:   {type: array, items: {type: string}}
                  rows:      {type: integer}

  - id: range
    name: Ranges
    description: Reads a block of cells; overwrites one only on authorization.
    resources:
      secrets: [microsoft]
      data:    [write]
    functions:
      - id: read
        name: Read Range
        description: >
          The cells of a worksheet block, by A1 address ("A1:D40", "B7"),
          or the worksheet's used range when address is left out, as rows
          of text as Excel shows it. header takes the first row as the
          header. At most max_rows rows and 50 columns come back;
          rows_cut and columns_cut say how many were left out.
        permission_level: 0
        timeout_seconds: 45
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          required: [workbook_id, worksheet]
          properties:
            workbook_id: {type: string, minLength: 1, maxLength: 200}
            worksheet:   {type: string, minLength: 1, maxLength: 100}
            address:     {type: string, maxLength: 40}
            header:      {type: boolean, default: false}
            max_rows:    {type: integer, minimum: 1, maximum: 25, default: 20}
        outputs:
          type: object
          required: [worksheet, address, rows, row_count, rows_cut, columns_cut]
          properties:
            worksheet:   {type: string}
            address:     {type: string}
            header:      {type: array, items: {type: string}}
            rows:        {type: array, items: {type: array}}
            row_count:   {type: integer}
            rows_cut:    {type: integer}
            columns_cut: {type: integer}

      - id: update
        name: Overwrite Range
        description: >
          Write values into a worksheet block given by A1 address; values
          must be exactly the block's rows and columns (a null leaves that
          cell as it is). What the cells held before is kept in the write
          record and returned. Changes the user's workbook — only on their
          go-ahead.
        permission_level: 3
        timeout_seconds: 60
        resources:
          secrets: {microsoft: use}
          data:    {write: [create]}
        inputs:
          type: object
          additionalProperties: false
          required: [workbook_id, worksheet, address, values]
          properties:
            workbook_id: {type: string, minLength: 1, maxLength: 200}
            worksheet:   {type: string, minLength: 1, maxLength: 100}
            address:     {type: string, minLength: 2, maxLength: 40}
            values:
              type: array
              minItems: 1
              maxItems: 25
              items:
                type: array
                minItems: 1
                maxItems: 20
                items: {type: [string, number, boolean, "null"], maxLength: 2000}
        outputs:
          type: object
          required: [write_ref, worksheet, address, cells, previous]
          properties:
            write_ref: {type: string, x-resource: {type: data, id: write}}
            worksheet: {type: string}
            address:   {type: string}
            cells:     {type: integer}
            previous:  {type: array, items: {type: array}}

  - id: table
    name: Tables
    description: Reads a table's rows by header; appends rows only on authorization.
    resources:
      secrets: [microsoft]
      data:    [write]
    functions:
      - id: rows
        name: Table Rows
        description: >
          A table's data rows as objects keyed by its headers, in table
          order, a page at a time; next_page_token continues.
        permission_level: 0
        timeout_seconds: 45
        resources:
          secrets: {microsoft: use}
        inputs:
          type: object
          additionalProperties: false
          required: [workbook_id, table]
          properties:
            workbook_id: {type: string, minLength: 1, maxLength: 200}
            table:       {type: string, minLength: 1, maxLength: 100}
            max_results: {type: integer, minimum: 1, maximum: 25, default: 20}
            page_token:  {type: string, maxLength: 10}
        outputs:
          type: object
          required: [table, worksheet, headers, total, rows]
          properties:
            table:           {type: string}
            worksheet:       {type: string}
            headers:         {type: array, items: {type: string}}
            total:           {type: integer}
            rows:            {type: array, items: {type: object}}
            next_page_token: {type: string}

      - id: add_rows
        name: Add Table Rows
        description: >
          Append rows to the end of a table, each given as an object keyed
          by the table's headers (a header left out stays empty; a name
          the table does not have is refused). Lands as one change and is
          recorded. Changes the user's workbook — only on their go-ahead.
        permission_level: 3
        timeout_seconds: 60
        resources:
          secrets: {microsoft: use}
          data:    {write: [create]}
        inputs:
          type: object
          additionalProperties: false
          required: [workbook_id, table, rows]
          properties:
            workbook_id: {type: string, minLength: 1, maxLength: 200}
            table:       {type: string, minLength: 1, maxLength: 100}
            rows:
              type: array
              minItems: 1
              maxItems: 25
              items: {type: object, minProperties: 1}
        outputs:
          type: object
          required: [write_ref, table, added, total_rows]
          properties:
            write_ref:  {type: string, x-resource: {type: data, id: write}}
            table:      {type: string}
            added:      {type: integer}
            total_rows: {type: integer}

  - id: rows
    name: Row Watches
    description: >
      Remembers how far a table or worksheet has been read and hands on
      the rows added since.
    resources:
      secrets: [microsoft]
      data:    [watch]
    functions:
      - id: watch
        name: Watch For New Rows
        description: >
          Start watching a table (preferred) or a worksheet's used range
          for rows added from now on. Record it once, then schedule
          rows.new.
        permission_level: 1
        timeout_seconds: 45
        resources:
          secrets: {microsoft: use}
          data:    {watch: [create]}
        inputs:
          type: object
          additionalProperties: false
          required: [workbook_id]
          properties:
            workbook_id: {type: string, minLength: 1, maxLength: 200}
            table:       {type: string, maxLength: 100}
            worksheet:   {type: string, maxLength: 100}
            note:        {type: string, maxLength: 500}
        outputs:
          type: object
          required: [watch_ref, workbook, worksheet, rows, headers]
          properties:
            watch_ref: {type: string, x-resource: {type: data, id: watch}}
            workbook:  {type: string}
            table:     {type: string}
            worksheet: {type: string}
            rows:      {type: integer}
            headers:   {type: array, items: {type: string}}

      - id: new
        name: New Rows
        description: >
          The rows added since the last check, for every row watch (or
          one, by watch_ref): oldest first, keyed by header, each naming
          its watch and worksheet row. Moves the watch forward; "more"
          says a later check continues. A watch whose table or sheet lost
          rows reports nothing, starts again from its current size and
          is listed in "reset" with a sentence. Schedule it with
          wake_field "rows" to be woken only when rows arrived.
        permission_level: 1
        timeout_seconds: 60
        schedulable: true
        resources:
          secrets: {microsoft: use}
          data:    {watch: [list, read, update]}
        inputs:
          type: object
          additionalProperties: false
          properties:
            watch_ref:   {type: string, x-resource: {type: data, id: watch}}
            max_results: {type: integer, minimum: 1, maximum: 25, default: 20}
        outputs:
          type: object
          required: [checked, rows, more, reset]
          properties:
            checked: {type: integer}
            more:    {type: boolean}
            rows:
              type: array
              items:
                type: object
                properties:
                  watch_ref:  {type: string, x-resource: {type: data, id: watch}}
                  workbook:   {type: string}
                  table:      {type: string}
                  worksheet:  {type: string}
                  row_number: {type: integer}
                  values:     {type: object}
            reset:
              type: array
              items:
                type: object
                properties:
                  watch_ref: {type: string, x-resource: {type: data, id: watch}}
                  workbook:  {type: string}
                  table:     {type: string}
                  worksheet: {type: string}
                  rows:      {type: integer}
                  note:      {type: string}
